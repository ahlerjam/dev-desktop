<?xml version="1.0" encoding="UTF-8"?>
<!-- Hintergrundbild Dev-Desktop (Blau/Violett): selbst erzeugt (Farbverläufe), keine fremden Rechte.
     PNG fürs Image: rsvg-convert -w 2560 quellen/<name>.svg -o root/usr/share/backgrounds/dev-desktop/<name>.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="0.55" stop-color="#1b1f4b"/><stop offset="1" stop-color="#2a1140"/>
    </linearGradient>
    <radialGradient id="f0"><stop offset="0" stop-color="#3b6cff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#3b6cff" stop-opacity="0.34"/><stop offset="1" stop-color="#3b6cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="f1"><stop offset="0" stop-color="#8a3ffc" stop-opacity="0.7"/><stop offset="0.5" stop-color="#8a3ffc" stop-opacity="0.32"/><stop offset="1" stop-color="#8a3ffc" stop-opacity="0"/></radialGradient>
    <radialGradient id="f2"><stop offset="0" stop-color="#12c2e9" stop-opacity="0.55"/><stop offset="0.5" stop-color="#12c2e9" stop-opacity="0.25"/><stop offset="1" stop-color="#12c2e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="f3"><stop offset="0" stop-color="#c471ed" stop-opacity="0.5"/><stop offset="0.5" stop-color="#c471ed" stop-opacity="0.23"/><stop offset="1" stop-color="#c471ed" stop-opacity="0"/></radialGradient>
    <radialGradient id="f4"><stop offset="0" stop-color="#1f4bff" stop-opacity="0.6"/><stop offset="0.5" stop-color="#1f4bff" stop-opacity="0.27"/><stop offset="1" stop-color="#1f4bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rand" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#grund)"/>
  <ellipse cx="700" cy="500" rx="1500" ry="1100" fill="url(#f0)"/>
  <ellipse cx="2900" cy="400" rx="1700" ry="1150" fill="url(#f1)"/>
  <ellipse cx="2100" cy="1800" rx="2100" ry="1000" fill="url(#f2)"/>
  <ellipse cx="500" cy="1900" rx="1300" ry="900" fill="url(#f3)"/>
  <ellipse cx="3500" cy="1700" rx="1200" ry="1000" fill="url(#f4)"/>
  <rect width="3840" height="2160" fill="url(#rand)"/>
</svg>
